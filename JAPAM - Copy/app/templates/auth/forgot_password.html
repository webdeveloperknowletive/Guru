<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Spiritual Commerce Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-app);
      padding: 1.5rem;
    }
    .auth-card {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <h1 style="font-size: 1.35rem; font-weight: 700; color: var(--text-primary);">Reset Admin Password</h1>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem;">Enter your verified admin email to receive recovery instructions.</p>
    </div>

    {% if message %}
      <div class="alert alert-success">
        <span>{{ message }}</span>
      </div>
    {% endif %}

    {% if error %}
      <div class="alert alert-danger">
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="form-group">
        <label class="form-label">Admin Email</label>
        <input type="email" name="email" class="form-control" placeholder="admin@japam.in" required autofocus>
      </div>

      <button type="submit" class="btn-primary" style="width:100%; justify-content:center; padding:0.65rem 1rem;">
        Send Recovery Link
      </button>

      <div style="text-align:center; margin-top:1.25rem;">
        <a href="{{ url_for('auth.login') }}" style="font-size:0.8rem; color:var(--saffron-600); text-decoration:none;">&larr; Return to Sign In</a>
      </div>
    </form>
  </div>
</body>
</html>
