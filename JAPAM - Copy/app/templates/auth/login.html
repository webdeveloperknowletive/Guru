<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In - Spiritual Commerce Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-app);
      padding: 1.5rem;
    }
    .auth-card {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-brand svg {
      width: 48px;
      height: 48px;
      color: var(--saffron-500);
      margin-bottom: 0.75rem;
    }
    .auth-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .auth-subtitle {
      font-size: 0.8rem;
      color: var(--saffron-600);
      font-weight: 500;
      margin-top: 0.2rem;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .auth-divider::before { margin-right: 0.5rem; }
    .auth-divider::after { margin-left: 0.5rem; }
    .btn-oauth-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: #ffffff;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-oauth-google:hover {
      background-color: var(--bg-card-subtle);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C8 6 6 10 6 14a6 6 0 0 0 12 0c0-4-2-8-6-12Z"/>
        <path d="M6 14C3 13 2 10 2 8c2 0 4 2 5 4"/>
        <path d="M18 14c3-1 4-4 4-6-2 0-4 2-5 4"/>
        <path d="M12 22a8 8 0 0 0 8-5c-2 0-5 2-8 3-3-1-6-3-8-3a8 8 0 0 0 8 5Z"/>
      </svg>
      <h1 class="auth-title">Spiritual Commerce Admin</h1>
      <span class="auth-subtitle">Seva · Sanskriti · Samṛddhi</span>
    </div>

    {% if error %}
      <div class="alert alert-danger" style="margin-bottom: 1.25rem;">
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="admin@japam.in" value="{{ email or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem;">
          <label class="form-label" style="margin-bottom:0;">Password</label>
          <a href="{{ url_for('auth.forgot_password') }}" style="font-size:0.75rem; color:var(--saffron-600); text-decoration:none;">Forgot password?</a>
        </div>
        <input type="password" name="password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
        <input type="checkbox" name="remember" id="remember">
        <label for="remember" style="font-size:0.8rem; color:var(--text-secondary); cursor:pointer;">Keep me signed in for 30 days</label>
      </div>

      <button type="submit" class="btn-primary" style="width:100%; justify-content:center; padding:0.65rem 1rem;">
        Sign In to Admin
      </button>
    </form>

    {% if oauth_enabled %}
      <div class="auth-divider">Or continue with</div>
      <a href="{{ url_for('auth.oauth_google_start') }}" class="btn-oauth-google">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Sign in with Google OIDC
      </a>
    {% endif %}
  </div>
</body>
</html>
