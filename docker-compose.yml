services:
  # -------------------------------------------------------------
  # 1. Next.js Storefront (AstroVeda)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./astroveda
      dockerfile: Dockerfile
    image: astroveda-storefront:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://backend:5000
      - NEXT_PUBLIC_API_BASE_URL=/api/v1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    networks:
      - app_net

  # -------------------------------------------------------------
  # 2. Flask REST API & Spiritual Commerce Admin
  # -------------------------------------------------------------
  backend:
    build:
      context: ./JAPAM - Copy
      dockerfile: Dockerfile
    image: japam-backend:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql+psycopg://japam_user:secure_japam_password_2024@postgres:5432/japam_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-prod-spiritual-secret-key-change-in-coolify}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-spiritual-secret-key-change-in-coolify}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY:-csrf-spiritual-protection-key-32chars}
      - COOKIE_SECURE=true
      - COOKIE_SAMESITE=Lax
      - UPLOAD_FOLDER=/app/app/static/uploads
      - TIMEZONE=Asia/Kolkata
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - uploads_data:/app/app/static/uploads
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health/ready"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
    networks:
      - app_net

  # -------------------------------------------------------------
  # 3. Asynchronous Background Task Worker
  # -------------------------------------------------------------
  worker:
    build:
      context: ./JAPAM - Copy
      dockerfile: Dockerfile
    image: japam-worker:latest
    command: ["python", "worker.py"]
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql+psycopg://japam_user:secure_japam_password_2024@postgres:5432/japam_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-prod-spiritual-secret-key-change-in-coolify}
      - UPLOAD_FOLDER=/app/app/static/uploads
    volumes:
      - uploads_data:/app/app/static/uploads
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - app_net

  # -------------------------------------------------------------
  # 4. PostgreSQL 16 Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-japam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_japam_password_2024}
      POSTGRES_DB: ${POSTGRES_DB:-japam_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-japam_user} -d ${POSTGRES_DB:-japam_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    networks:
      - app_net

  # -------------------------------------------------------------
  # 5. Redis 7 Cache & Rate Limiting Engine
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    networks:
      - app_net

# ---------------------------------------------------------------
# Persistent Volumes & Docker Bridge Network
# ---------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  app_net:
    driver: bridge
